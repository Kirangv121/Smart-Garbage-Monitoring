<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garbage Monitoring Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 80%;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
        }
        .status {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        .bin {
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            width: 30%;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }
        .bin span {
            font-size: 18px;
            font-weight: bold;
        }
        .alert {
            color: red;
            font-weight: bold;
            position: absolute;
            top: 5px;
            right: 5px;
        }
        .bin.low {
            background: #90ee90;
        }
        .bin.medium {
            background: #ffd700;
        }
        .bin.high {
            background: #ff6961;
        }
        .refresh-btn {
            display: block;
            width: 200px;
            margin: 20px auto;
            padding: 10px;
            text-align: center;
            background: #007bff;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .refresh-btn:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Garbage Monitoring Dashboard</h1>
        <div class="status">
            <div class="bin" id="bin1">Bin 1: <span>Loading...</span></div>
        </div>
        <div class="refresh-btn" onclick="updateBins()">Refresh Data</div>
    </div>

    <script>
        // Function to update the bin status based on the fetched data
        function updateBins() {
            fetch('http://130.1.74.196:5000/api/get_data')  // Make sure this IP matches your Flask server IP
                .then(response => response.json())
                .then(data => {
                    const bin1Element = document.getElementById('bin1');
                    const level = 100 - ((data['bin1_distance'] / 100) * 100); // Assuming 100cm max depth

                    // Update the bin text with the current level
                    bin1Element.innerHTML = `Bin 1: <span>${level.toFixed(1)}%</span>`;

                    // Clear previous classes
                    bin1Element.classList.remove("low", "medium", "high");

                    // Add new class based on the level
                    if (level < 20) {
                        bin1Element.classList.add("low");
                    } else if (level >= 20 && level <= 60) {
                        bin1Element.classList.add("medium");
                    } else {
                        bin1Element.classList.add("high");
                        bin1Element.innerHTML += ' <span class="alert">(ALERT!)</span>';  // Show alert if the bin is high
                    }
                })
                .catch(error => console.error("Error fetching data:", error));
        }

        // Set interval to refresh the data every 5 seconds
        setInterval(updateBins, 5000);
        updateBins();  // Initial call to populate the data immediately
    </script>
</body>
</html>
